spring:
  application:
    name: bashkirceva.springproject
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

jwt:
  secret: ${JWT_SECRET:local-dev-jwt-secret-change-me-32chars-minimum}
